name = "IUTLeanReference"
defaultTargets = ["IUT1", "IUT1Audit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8f9d9cff6bd728b17a24e163c9402775d9e6a365"

[[lean_lib]]
name = "IUT1"
srcDir = "src"

[[lean_lib]]
name = "IUT1Audit"
srcDir = "test"
globs = [
  "IUT1Audit",
  "IUT1.SymmetryCoreAxiomAudit",
  "IUT1.SignOrbitBridgeAxiomAudit",
  "IUT1.SignedAffineCoreAxiomAudit",
  "IUT1.SignedAffineDihedralAxiomAudit",
  "IUT1.Applications.ConventionAuditAxiomAudit",
  "IUT1.Applications.PolyMorphismPrototypeAxiomAudit",
  "IUT1.TutorialAxiomAudit",
]
